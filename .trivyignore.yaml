# Trivy suppression file (#174) — image + SBOM scanning.
#
# The release image scan, the release SBOM scan, and the weekly deep scan run with
# `ignore-unfixed: true` (ubi9/ubi-micro carries unfixable base CVEs — fixable-only keeps the gate
# actionable) and `severity: CRITICAL,HIGH`. A CRITICAL/HIGH fixable finding fails the release job and
# the weekly job; it is FIXED (bump the dependency / base) or suppressed HERE, never silently ignored.
#
# SUPPRESSION PROCESS (committed policy — see docs/SECURITY-GATES.md): every entry MUST carry:
#   - id:         the CVE / advisory id.
#   - statement:  owner (@eldermoraes) + the concrete reason (why it is not exploitable / not fixable now).
#   - expired_at: a mandatory expiry date (YYYY-MM-DD). After it, Trivy re-surfaces the finding.
#
# CURRENT ENTRIES — found by the FIRST full-transitive SBOM scan (the #174 validation dispatch, run
# 28725633724): 9 HIGH (0 CRITICAL), all fixable upstream, all Quarkus-platform-BOM-managed transitives
# (quarkus-bom 3.33.2 pins jackson-databind 2.21.2 + netty 4.1.133.Final). The repo rule (CLAUDE.md
# section 2) forbids pinning Quarkus-managed deps independently, so the remediation is the next Quarkus
# 3.33.x platform patch bump (a maintainer decision; Dependabot alerts + security-update PRs surface it
# automatically once the dependency graph is submitted on merge to main). Expiry = the 30-day HIGH SLA
# (docs/SECURITY-GATES.md section 3); Trivy re-surfaces everything on 2026-08-04 if the platform has not
# been bumped by then.

