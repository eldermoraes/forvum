# Media-generation tool (#187) REST-client default configuration.
#
# This is a LIBRARY module, so its defaults ship in META-INF/microprofile-config.properties (a config
# source loaded from every JAR on the classpath, ordinal 100) rather than application.properties (which
# Quarkus loads only from the application artifact, forvum-app — a dependency's application.properties
# is NOT a reliable config source in the assembled binary). This guarantees the rest-client config below
# is effective wherever forvum-tools-media-gen is bundled; forvum-app or the operator (env vars)
# override at a higher ordinal.
#
# The images backend base URL is a per-deployment value read from tools/media-gen.json at runtime;
# ImagesApi overrides the base URL per invocation via @Url. A static base URL is still required for the
# REST client to register, so this is the placeholder the @Url replaces (the tool is inert unless an
# operator sets a baseUrl in tools/media-gen.json, so this default is never actually called). Image
# generation is slow, hence the generous read timeout.
quarkus.rest-client."media-gen-api".url=https://api.openai.com
quarkus.rest-client."media-gen-api".connect-timeout=5000
quarkus.rest-client."media-gen-api".read-timeout=120000
