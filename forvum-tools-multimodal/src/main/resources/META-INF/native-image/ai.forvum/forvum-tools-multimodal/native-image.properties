# Native-image hints for Apache PDFBox (#185). The pdf.analyze text-layer path never decrypts a PDF
# (encrypted PDFs are rejected), so BouncyCastle is deliberately excluded (bcprov/bcpkix optional). Two
# reachable PDFBox encryption classes reference org.bouncycastle unconditionally — the certificate/public-key
# security handler and its provider holder — which fail build-time class-initialization with
# NoClassDefFoundError: org/bouncycastle/cms/CMSException. Deferring their initialization to run time keeps
# them out of the build-time link set (a run-time-initialized class's unresolved optional references are
# tolerated); they are never actually executed, so the missing BC classes are never touched at run time.
Args = --initialize-at-run-time=org.apache.pdfbox.pdmodel.encryption.PublicKeySecurityHandler,org.apache.pdfbox.pdmodel.encryption.SecurityProvider
