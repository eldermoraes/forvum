# Pin forvum.home to a throwaway path so the @QuarkusTest wiring IT is hermetic regardless of the
# developer's real ~/.forvum/. Since #192 (keyless DuckDuckGo default) a NO-config web.search invoke
# would dial the real internet, so WebToolProviderWiringIT SEEDS tools/web.json = {"backend":"brave"}
# (no key) under this home to keep the invoke offline (the config-shaped message path).
forvum.home=${java.io.tmpdir}/forvum-web-it-home-absent
